<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceID System{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f13;
            color: #e8e8f0;
            min-height: 100vh;
        }

        nav {
            background: #1a1a24;
            border-bottom: 1px solid #2a2a3a;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #6ee7b7;
            letter-spacing: -0.5px;
        }

        nav a {
            color: #9090b0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover { color: #6ee7b7; }

        .container {
            max-width: 900px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #f0f0ff; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #c0c0d8; }

        .card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary  { background: #6ee7b7; color: #0f0f13; }
        .btn-primary:hover  { background: #4dd4a0; }
        .btn-danger   { background: #f87171; color: #0f0f13; }
        .btn-danger:hover   { background: #ef4444; }
        .btn-secondary { background: #2a2a3a; color: #e8e8f0; }
        .btn-secondary:hover { background: #3a3a4a; }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #0f0f13;
            border: 1px solid #3a3a4a;
            border-radius: 8px;
            color: #e8e8f0;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #6ee7b7;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #9090b0;
            margin-bottom: 0.4rem;
        }

        .messages { margin-bottom: 1rem; }
        .message {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .message.success { background: #064e3b; border: 1px solid #6ee7b7; color: #6ee7b7; }
        .message.error   { background: #450a0a; border: 1px solid #f87171; color: #f87171; }
        .message.warning { background: #451a03; border: 1px solid #fbbf24; color: #fbbf24; }

        /* Webcam */
        #video-container { display: none; margin-bottom: 1rem; }
        video { width: 100%; border-radius: 8px; max-height: 300px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">🔍 FaceID</span>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'enroll' %}">Enroll Face</a>
        <a href="{% url 'search' %}">Search Face</a>
        <a href="{% url 'enrolled_list' %}">Enrolled List</a>
    </nav>

    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
